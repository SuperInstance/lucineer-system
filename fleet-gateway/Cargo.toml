[package]
name = "fleet-gateway"
version = "0.1.0"
edition = "2021"
description = "Fleet API gateway sidecar: localhost reverse proxy with per-provider key chains and circuit breakers"
authors = ["SuperInstance"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tokio = { version = "1.0", features = ["rt-multi-thread", "macros", "signal", "time", "net"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
axum = "0.8"
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream"], default-features = false }
toml = "0.8"
http = "1"

[dev-dependencies]
tempfile = "3.0"
