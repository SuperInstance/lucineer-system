[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "ternary-rom"
version = "0.2.0"
description = "Model-to-GDS flow for mask-locked ternary inference chips"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "ternary-rom contributors"},
]
keywords = ["ternary", "quantization", "inference", "asic", "rom", "mask-locked", "edge-ai", "bitnet"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
    "Topic :: System :: Hardware :: Hardware Drivers",
]
dependencies = [
    "numpy>=1.21",
]

[project.optional-dependencies]
torch = ["torch>=1.13"]
dev = ["pytest>=7.0", "pytest-cov"]

[project.scripts]
ternary-rom = "ternary_rom.cli.main:cli_entry"

[tool.setuptools.packages.find]
include = ["ternary_rom*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
